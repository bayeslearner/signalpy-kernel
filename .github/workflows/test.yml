name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Conformance — the gate that decides whether the port still holds
        run: pytest src/plugkit/tests/test_conformance.py -v

      - name: Full suite
        run: pytest src/plugkit/tests -q

  no-optional-deps:
    # Every optional extra must degrade, not fail. This job is the proof.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pyyaml watchdog
      - name: Full suite with no dependency-injector
        run: pytest src/plugkit/tests -q

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyright
      - name: The typed-ctx claims must stay true
        run: pytest src/plugkit/tests/test_typing.py -v
