project:
  type: website
  output-dir: _site
  render:
    # Current docs only. docs/history/ holds the retired signalpy book and the
    # April design notes; both stay in the repo and out of the site.
    - "!history/"
    - index.qmd
    - guide/*.qmd
    - design/*.md
    - design/*.qmd
    - steering/*.md

website:
  title: "plugkit"
  site-url: "https://bayeslearner.github.io/plugkit/"
  repo-url: "https://github.com/bayeslearner/plugkit"
  repo-actions: [edit, issue]
  navbar:
    left:
      - text: "Guide"
        menu:
          - text: "Why plugkit exists"
            href: guide/00-why.qmd
          - text: "Your first plugin"
            href: guide/01-first-plugin.qmd
          - text: "Plain components"
            href: guide/02-popo-components.qmd
          - text: "Tools and permission"
            href: guide/03-tools.qmd
          - text: "Writing your own service"
            href: guide/04-your-own-service.qmd
          - text: "Config and reactivity"
            href: guide/05-config-and-reactivity.qmd
          - text: "Composition from a file"
            href: guide/06-composition-from-a-file.qmd
          - text: "Testing"
            href: guide/07-testing.qmd
      - text: "Design"
        menu:
          - text: "Kernel architecture"
            href: design/kernel-architecture.md
          - text: "The reactive engine"
            href: design/reactive-engine.qmd
          - text: "What it does not replace"
            href: design/what-it-does-not-replace.qmd
          - text: "Why not build on iPOPO"
            href: design/why-not-ipopo.qmd
          - text: "Pillars"
            href: steering/pillars.md
      - text: "GitHub"
        href: https://github.com/bayeslearner/plugkit

  sidebar:
    - title: "Guide"
      contents:
        - guide/00-why.qmd
        - guide/01-first-plugin.qmd
        - guide/02-popo-components.qmd
        - guide/03-tools.qmd
        - guide/04-your-own-service.qmd
        - guide/05-config-and-reactivity.qmd
        - guide/06-composition-from-a-file.qmd
        - guide/07-testing.qmd

format:
  html:
    theme:
      dark: darkly
    css:
      - custom.css
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    mermaid:
      theme: dark
    filters:
      - present-mode
