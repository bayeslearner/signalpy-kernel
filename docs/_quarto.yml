project:
  type: website
  output-dir: _site

website:
  title: "plugkit"
  site-url: "https://bayeslearner.github.io/plugkit/"
  repo-url: "https://github.com/bayeslearner/plugkit"
  repo-actions: [edit, issue]
  navbar:
    left:
      - text: "Guide"
        menu:
          - text: "Why plugkit exists"
            href: guide/00-why.qmd
          - text: "Your first plugin"
            href: guide/01-first-plugin.qmd
          - text: "Plain components"
            href: guide/02-popo-components.qmd
          - text: "Tools and permission"
            href: guide/03-tools.qmd
      - text: "Design"
        menu:
          - text: "Kernel architecture"
            href: design/kernel-architecture.md
          - text: "Pillars"
            href: steering/pillars.md
      - text: "History"
        menu:
          - text: "The retired signalpy book"
            href: history/2026-08-v1-book/guide/00-layer-rules.qmd

  sidebar:
    - title: "Guide"
      contents:
        - guide/00-why.qmd
        - guide/01-first-plugin.qmd
        - guide/02-popo-components.qmd
        - guide/03-tools.qmd

format:
  html:
    theme:
      dark: darkly
    css:
      - custom.css
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    mermaid:
      theme: dark
    filters:
      - present-mode
